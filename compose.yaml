# yt-dl derrière le serveur OAuth2, en Docker.  Le plus simple : make help
#
#   Configuration : .env (copie de .env.example), le même fichier qu'en local sans Docker.
#   Ce fichier-ci ne fixe que les chemins internes au conteneur.
#
# Le serveur OAuth peut être sur une autre machine : aucun réseau Docker partagé,
# yt-dl le joint par son URL (OAUTH_SERVER_URL), et lui joint yt-dl par APP_URL.
services:
  yt-dl:
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    image: ${IMAGE_NAME:-yt-dl}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # Prioritaires sur .env : chemins internes au conteneur
      OAUTH_PUBLIC_KEY_FILE: /run/secrets/oauth_public_key
      OAUTH_STATE_DB: /data/oauth_state.sqlite3
      JOBS_DIR: /data/jobs
      # Cookies YouTube (facultatif, docs/youtube-cookies.md) : vide si absent de .env
      YTDL_COOKIES_FILE: ${YTDL_COOKIES_FILE:+/run/youtube/cookies.txt}
    secrets:
      - oauth_public_key
    ports:
      # Uniquement sur la machine : sans le préfixe d'IP, Docker ouvre le port
      # à tout le réseau en contournant le pare-feu (UFW). HTTPS = reverse proxy de l'hôte.
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8765}:8765"
    volumes:
      - ytdl_data:/data          # sessions SQLite + fichiers en cours de téléchargement
      # Dossier et non fichier : un cookies.txt remplacé (scp) est vu sans redémarrage
      - ./var/youtube:/run/youtube:ro
    tmpfs:
      - /tmp:size=256m,mode=1777 # caches deno / yt-dlp (le reste du système est en lecture seule)
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${MEM_LIMIT:-2g}
    cpus: ${CPUS:-2}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

secrets:
  oauth_public_key:
    file: ${OAUTH_PUBLIC_KEY_FILE:-var/oauth-public.pem}

volumes:
  ytdl_data:

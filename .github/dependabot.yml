# Mises à jour automatiques proposées en PR (la CI les valide avant merge).
# Versions : mensuelles, groupées, avec délai de 7 jours après publication.
# Les mises à jour de sécurité ne sont ni retardées ni plafonnées par cette config.
version: 2
updates:
  # Actions épinglées par SHA : met à jour le SHA et le commentaire de version
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major:
        update-types: ["major"]
    commit-message:
      prefix: "chore(deps)"

  # Dépendances Python (uv.lock). yt-dlp casse souvent côté YouTube : il reste
  # hebdomadaire, sans délai, dans son propre groupe (le premier groupe qui correspond gagne).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
      exclude: ["yt-dlp", "yt-dlp-ejs"]
    groups:
      yt-dlp:
        patterns: ["yt-dlp", "yt-dlp-ejs"]
      minor-and-patch:
        update-types: ["minor", "patch"]
      major:
        update-types: ["major"]
    commit-message:
      prefix: "chore(deps)"

  # Images de base du Dockerfile (python slim, uv)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
      major:
        update-types: ["major"]
    commit-message:
      prefix: "chore(deps)"

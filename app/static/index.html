<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>yt-dl</title>
<style>
  :root {
    --deck:   #12161c;
    --panel:  #1a2028;
    --raised: #212933;
    --edge:   #2b3540;
    --ink:    #e6eaf0;
    --muted:  #8894a4;
    --video:  #f2a03d;
    --audio:  #4fc3d9;
    --subs:   #b58cf0;
    --danger: #ff6b5e;

    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

    --gap: 20px;
    --radius: 3px;
    --channel: var(--video);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 20px 80px;
    background: var(--deck);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .shell { max-width: 660px; margin: 0 auto; }

  /* ---- masthead ---- */

  .masthead { display: flex; align-items: baseline; gap: 12px; margin-bottom: 28px; }

  .wordmark {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.02em;
    margin: 0;
  }

  .tally {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--edge);
    align-self: center;
    transition: background 200ms;
  }
  .tally[data-live="true"] {
    background: var(--channel);
    box-shadow: 0 0 8px var(--channel);
    animation: breathe 1.6s ease-in-out infinite;
  }
  @keyframes breathe { 50% { opacity: 0.35; } }

  .masthead p {
    margin: 0 0 0 auto;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---- shared furniture ---- */

  .label {
    display: block;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: var(--radius);
    padding: var(--gap);
    margin-bottom: 16px;
  }

  button, input, select { font: inherit; color: inherit; }

  :focus-visible {
    outline: 2px solid var(--channel);
    outline-offset: 2px;
  }

  /* ---- intake ---- */

  .intake { display: flex; gap: 10px; margin-bottom: 16px; }

  .intake input {
    flex: 1;
    min-width: 0;
    font-family: var(--mono);
    font-size: 13px;
    padding: 12px 14px;
    background: var(--panel);
    border: 1px solid var(--edge);
    border-radius: var(--radius);
  }
  .intake input::placeholder { color: var(--muted); }
  .intake input:focus { border-color: var(--channel); outline: none; }

  .btn {
    border: 1px solid var(--edge);
    background: var(--raised);
    padding: 12px 20px;
    border-radius: var(--radius);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 150ms, background 150ms;
  }
  .btn:hover:not(:disabled) { border-color: var(--muted); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .btn-go {
    background: var(--channel);
    border-color: var(--channel);
    color: #0e1219;
    font-weight: 600;
    width: 100%;
    padding: 14px;
  }
  .btn-go:hover:not(:disabled) { filter: brightness(1.1); }

  /* ---- banner ---- */

  .banner {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    border: 1px solid var(--danger);
    border-left-width: 3px;
    border-radius: var(--radius);
    background: rgba(255, 107, 94, 0.07);
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: 14px;
  }
  .banner span { flex: 1; }
  .banner button {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 18px; line-height: 1; padding: 0;
  }

  /* ---- probe result ---- */

  .meta { display: flex; gap: 16px; align-items: flex-start; }
  .meta img {
    width: 168px;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    border-radius: 2px;
    background: var(--raised);
    flex-shrink: 0;
  }
  .meta h2 { margin: 0 0 6px; font-size: 17px; font-weight: 600; line-height: 1.3; }
  .meta dl {
    margin: 0;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }
  .meta dd { margin: 0; }

  /* ---- channel tabs ---- */

  .tabs { display: flex; gap: 4px; margin-bottom: 16px; }

  .tab {
    flex: 1;
    background: none;
    border: none;
    border-bottom: 2px solid var(--edge);
    padding: 10px 0;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    transition: color 150ms, border-color 150ms;
  }
  .tab[aria-selected="true"] { color: var(--ink); }
  .tab[data-channel="video"][aria-selected="true"] { border-bottom-color: var(--video); }
  .tab[data-channel="audio"][aria-selected="true"] { border-bottom-color: var(--audio); }

  /* ---- the ladder: rungs sized by file weight ---- */

  .ladder { display: flex; flex-direction: column; gap: 2px; }

  .rung {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 12px;
    border-radius: 2px;
    cursor: pointer;
    isolation: isolate;
    transition: background 150ms;
  }
  .rung:hover { background: var(--raised); }
  .rung input { position: absolute; opacity: 0; pointer-events: none; }

  /* the bar is the rung's own weight, drawn behind its text */
  .rung::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: var(--weight, 0%);
    background: var(--channel);
    opacity: 0.13;
    border-radius: 2px;
    z-index: -1;
    transition: opacity 150ms;
  }
  .rung:has(input:checked)::before { opacity: 0.3; }
  .rung:has(input:checked) { background: var(--raised); }

  .rung-mark {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--edge);
    flex-shrink: 0;
    transition: background 150ms;
  }
  .rung:has(input:checked) .rung-mark { background: var(--channel); }

  .rung-name {
    font-family: var(--mono);
    font-size: 13px;
    min-width: 74px;
  }
  .rung-note {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-left: auto;
    font-variant-numeric: tabular-nums;
  }

  /* ---- small segmented control ---- */

  .segmented { display: flex; gap: 2px; }
  .segmented label {
    flex: 1;
    text-align: center;
    padding: 8px;
    border: 1px solid var(--edge);
    border-radius: 2px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--muted);
    cursor: pointer;
    transition: color 150ms, border-color 150ms;
  }
  .segmented input { position: absolute; opacity: 0; pointer-events: none; }
  .segmented label:has(input:checked) {
    color: var(--ink);
    border-color: var(--channel);
  }
  .segmented label:has(input:disabled) { opacity: 0.4; cursor: not-allowed; }

  /* ---- subtitle tracks ---- */

  .tracks {
    max-height: 172px;
    overflow-y: auto;
    border: 1px solid var(--edge);
    border-radius: 2px;
  }
  .tracks-group {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 8px 12px 4px;
    position: sticky;
    top: 0;
    background: var(--panel);
  }
  .track {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 13px;
  }
  .track:hover { background: var(--raised); }
  .track input { accent-color: var(--subs); margin: 0; }
  .track code {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    margin-left: auto;
  }

  .note {
    font-size: 12px;
    color: var(--muted);
    margin: 10px 0 0;
    padding-left: 10px;
    border-left: 2px solid var(--subs);
  }

  /* ---- progress ---- */

  .track-rail {
    height: 3px;
    background: var(--edge);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .track-fill {
    height: 100%;
    width: 0;
    background: var(--channel);
    transition: width 250ms ease-out, background 250ms;
  }
  .readout {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  .readout b { color: var(--ink); font-weight: 500; }

  .field + .field { margin-top: 18px; }
  [hidden] { display: none !important; }

  @media (max-width: 560px) {
    .meta { flex-direction: column; }
    .meta img { width: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="shell">

  <header class="masthead">
    <h1 class="wordmark">yt-dl</h1>
    <i class="tally" id="tally" data-live="false" aria-hidden="true"></i>
    <p>local · personal use</p>
  </header>

  <div class="banner" id="banner" role="alert" hidden>
    <span id="banner-text"></span>
    <button type="button" id="banner-close" aria-label="Dismiss">&times;</button>
  </div>

  <form class="intake" id="intake">
    <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=…"
           aria-label="YouTube URL" autocomplete="off" required>
    <button class="btn" id="probe-btn" type="submit">Probe</button>
  </form>

  <p class="label" id="empty">Paste a YouTube link to see what's available.</p>

  <section id="result" hidden>
    <div class="panel">
      <div class="meta">
        <img id="thumb" alt="">
        <div>
          <h2 id="title"></h2>
          <dl>
            <dd id="uploader"></dd>
            <dd id="duration"></dd>
          </dl>
        </div>
      </div>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-channel="video" aria-selected="true"
              aria-controls="panel-video" id="tab-video" type="button">Video</button>
      <button class="tab" role="tab" data-channel="audio" aria-selected="false"
              aria-controls="panel-audio" id="tab-audio" type="button">Audio</button>
    </div>

    <div class="panel" id="panel-video" role="tabpanel" aria-labelledby="tab-video">
      <div class="field">
        <span class="label">Quality</span>
        <div class="ladder" id="quality-ladder" role="radiogroup" aria-label="Quality"></div>
      </div>

      <div class="field">
        <span class="label">Container</span>
        <div class="segmented" id="container-group">
          <label>MP4<input type="radio" name="container" value="mp4" checked></label>
          <label>MKV<input type="radio" name="container" value="mkv"></label>
        </div>
        <p class="note" id="mkv-note" hidden>
          Switched to MKV — it carries subtitle tracks that MP4 converts to a
          format many players ignore. Switch back if you need MP4.
        </p>
      </div>

      <div class="field" id="subs-field">
        <span class="label">Subtitles</span>
        <div class="tracks" id="tracks"></div>
      </div>
    </div>

    <div class="panel" id="panel-audio" role="tabpanel" aria-labelledby="tab-audio" hidden>
      <div class="field">
        <span class="label">Format</span>
        <div class="ladder" id="audio-ladder" role="radiogroup" aria-label="Audio format"></div>
      </div>

      <div class="field">
        <span class="label">Bitrate</span>
        <div class="segmented" id="bitrate-group">
          <label>320<input type="radio" name="bitrate" value="320" disabled></label>
          <label>256<input type="radio" name="bitrate" value="256" disabled></label>
          <label>192<input type="radio" name="bitrate" value="192" checked disabled></label>
          <label>128<input type="radio" name="bitrate" value="128" disabled></label>
        </div>
      </div>
    </div>

    <button class="btn btn-go" id="download-btn" type="button">Download</button>

    <div class="panel" id="progress" hidden style="margin-top:16px">
      <div class="track-rail"><div class="track-fill" id="fill"></div></div>
      <p class="readout" aria-live="polite">
        <b id="stage">Queued</b><span id="rate"></span>
      </p>
    </div>
  </section>
</div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);

const STAGES = {
  queued:    { text: "Queued",                channel: "video" },
  video:     { text: "Downloading video",     channel: "video" },
  audio:     { text: "Downloading audio",     channel: "audio" },
  merging:   { text: "Merging streams",       channel: "video" },
  embedding: { text: "Embedding subtitles",   channel: "subs"  },
  ready:     { text: "Ready",                 channel: "video" },
};

const AUDIO_FORMATS = [
  { value: "best", name: "Best",  note: "original stream, no re-encode" },
  { value: "mp3",  name: "MP3",   note: "plays everywhere" },
  { value: "m4a",  name: "M4A",   note: "AAC" },
  { value: "opus", name: "Opus",  note: "smallest at equal quality" },
];

let info = null;
let mode = "video";
let stream = null;
let mkvNudged = false;

/* ---------- helpers ---------- */

function setChannel(name) {
  document.documentElement.style.setProperty("--channel", `var(--${name})`);
}

function showError(message) {
  $("banner-text").textContent = message;
  $("banner").hidden = false;
}

function clearError() {
  $("banner").hidden = true;
}

function formatDuration(seconds) {
  if (!seconds) return "";
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  const pad = (n) => String(n).padStart(2, "0");
  return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

function formatSize(bytes) {
  if (!bytes) return "size unknown";
  return `${(bytes / 1048576).toFixed(0)} MB`;
}

function formatEta(seconds) {
  if (seconds === null || seconds === undefined) return "";
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m}:${String(s).padStart(2, "0")} left`;
}

/* ---------- rendering ---------- */

function rung(group, value, name, note, weight, checked) {
  const label = document.createElement("label");
  label.className = "rung";
  label.style.setProperty("--weight", `${weight}%`);
  label.innerHTML = `
    <input type="radio" name="${group}" value="${value}"${checked ? " checked" : ""}>
    <i class="rung-mark"></i>
    <span class="rung-name"></span>
    <span class="rung-note"></span>`;
  label.querySelector(".rung-name").textContent = name;
  label.querySelector(".rung-note").textContent = note;
  return label;
}

function renderQualities(qualities) {
  const ladder = $("quality-ladder");
  ladder.replaceChildren();

  if (!qualities.length) {
    ladder.innerHTML = `<p class="note">No video streams available — use the Audio tab.</p>`;
    return;
  }

  const heaviest = Math.max(...qualities.map((q) => q.filesize_approx || 0));
  qualities.forEach((q, i) => {
    const weight = heaviest ? Math.max(10, ((q.filesize_approx || 0) / heaviest) * 100) : 100;
    const note = [formatSize(q.filesize_approx), q.fps >= 50 ? `${q.fps}fps` : ""]
      .filter(Boolean).join("  ·  ");
    ladder.append(rung("quality", q.height, q.label, note, weight, i === 0));
  });
}

function renderAudioFormats() {
  const ladder = $("audio-ladder");
  ladder.replaceChildren();
  AUDIO_FORMATS.forEach((f, i) =>
    ladder.append(rung("audio_format", f.value, f.name, f.note, 100, i === 0))
  );
}

function renderTracks(subtitles) {
  const box = $("tracks");
  box.replaceChildren();

  if (!subtitles.length) {
    $("subs-field").hidden = true;
    return;
  }
  $("subs-field").hidden = false;

  const groups = [
    ["Published", subtitles.filter((s) => !s.auto)],
    ["Auto-generated", subtitles.filter((s) => s.auto)],
  ];

  for (const [heading, tracks] of groups) {
    if (!tracks.length) continue;
    const title = document.createElement("p");
    title.className = "tracks-group";
    title.textContent = heading;
    box.append(title);

    for (const track of tracks) {
      const label = document.createElement("label");
      label.className = "track";
      label.innerHTML = `<input type="checkbox" value="${track.lang}"
        data-auto="${track.auto}"><span></span><code></code>`;
      label.querySelector("span").textContent = track.name;
      label.querySelector("code").textContent = track.lang;
      box.append(label);
    }
  }
}

/* ---------- reading the form ---------- */

function selectedTracks() {
  return [...document.querySelectorAll("#tracks input:checked")];
}

function buildRequest(url) {
  if (mode === "audio") {
    const format = document.querySelector("input[name=audio_format]:checked").value;
    const request = { url, mode: "audio", audio_format: format };
    if (format !== "best") {
      request.bitrate = document.querySelector("input[name=bitrate]:checked").value;
    }
    return request;
  }

  const quality = document.querySelector("input[name=quality]:checked");
  const tracks = selectedTracks();
  return {
    url,
    mode: "video",
    height: quality ? Number(quality.value) : null,
    container: document.querySelector("input[name=container]:checked").value,
    subtitle_langs: tracks.map((t) => t.value),
    include_auto: tracks.some((t) => t.dataset.auto === "true"),
  };
}

/* ---------- actions ---------- */

async function post(path, body) {
  const response = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await response.json();
  if (!response.ok) throw new Error(data.detail || "Something went wrong.");
  return data;
}

async function probe(event) {
  event.preventDefault();
  clearError();
  const button = $("probe-btn");
  button.disabled = true;
  button.textContent = "Reading…";

  try {
    info = await post("/api/probe", { url: $("url").value.trim() });
    $("thumb").src = info.thumbnail;
    $("thumb").alt = "";
    $("title").textContent = info.title;
    $("uploader").textContent = info.uploader;
    $("duration").textContent = formatDuration(info.duration);
    renderQualities(info.video_qualities);
    renderAudioFormats();
    renderTracks(info.subtitles);
    mkvNudged = false;
    $("mkv-note").hidden = true;
    $("empty").hidden = true;
    $("result").hidden = false;
    $("progress").hidden = true;
  } catch (error) {
    showError(error.message);
  } finally {
    button.disabled = false;
    button.textContent = "Probe";
  }
}

async function download() {
  clearError();
  const button = $("download-btn");
  button.disabled = true;

  try {
    const { job_id } = await post("/api/jobs", buildRequest($("url").value.trim()));
    $("progress").hidden = false;
    $("fill").style.width = "0";
    $("stage").textContent = "Queued";
    $("rate").textContent = "";
    $("tally").dataset.live = "true";
    follow(job_id);
  } catch (error) {
    showError(error.message);
    button.disabled = false;
  }
}

function follow(jobId) {
  stream = new EventSource(`/api/jobs/${jobId}/events`);

  stream.onmessage = (event) => {
    const job = JSON.parse(event.data);
    const stage = STAGES[job.stage] || STAGES.queued;

    setChannel(stage.channel);
    $("stage").textContent = stage.text;
    $("fill").style.width = `${job.percent}%`;
    $("rate").textContent = [job.speed, formatEta(job.eta)].filter(Boolean).join("  ·  ");

    if (job.status === "done") {
      finish();
      $("stage").textContent = "Saving to your browser";
      $("rate").textContent = job.filename || "";
      window.location.href = `/api/jobs/${jobId}/file`;
    } else if (job.status === "failed") {
      finish();
      $("progress").hidden = true;
      showError(job.error || "The download failed.");
    }
  };

  stream.onerror = () => {
    if (stream.readyState === EventSource.CLOSED) {
      finish();
      showError("Lost contact with the server. Check that it is still running.");
    }
  };
}

function finish() {
  stream.close();
  stream = null;
  $("tally").dataset.live = "false";
  $("download-btn").disabled = false;
  setChannel(mode);
}

/* ---------- wiring ---------- */

$("intake").addEventListener("submit", probe);
$("download-btn").addEventListener("click", download);
$("banner-close").addEventListener("click", clearError);

for (const tab of document.querySelectorAll(".tab")) {
  tab.addEventListener("click", () => {
    mode = tab.dataset.channel;
    setChannel(mode);
    for (const other of document.querySelectorAll(".tab")) {
      other.setAttribute("aria-selected", String(other === tab));
    }
    $("panel-video").hidden = mode !== "video";
    $("panel-audio").hidden = mode !== "audio";
  });
}

// Picking a subtitle track once nudges the container to MKV; the user keeps control.
$("tracks").addEventListener("change", () => {
  if (mkvNudged || !selectedTracks().length) return;
  mkvNudged = true;
  document.querySelector("input[name=container][value=mkv]").checked = true;
  $("mkv-note").hidden = false;
});

// A bitrate only means something when we are re-encoding.
$("audio-ladder").addEventListener("change", (event) => {
  const transcoding = event.target.value !== "best";
  for (const input of document.querySelectorAll("input[name=bitrate]")) {
    input.disabled = !transcoding;
  }
});
</script>
</body>
</html>

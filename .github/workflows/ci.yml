# Tests, image Docker et audit de sécurité, à chaque push sur main et chaque PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Chaque lundi : nouvelles vulnérabilités connues dans les dépendances figées
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (hors-ligne)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.5"
          enable-cache: false
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -q

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Construit sans publier : vérifie Dockerfile + uv.lock
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: yt-dl:ci
      - name: Démarrage refusé sans OAuth (REQUIRE_LOGIN)
        run: |
          output=$(docker run --rm yt-dl:ci timeout 20 uvicorn app.main:app --port 8765 2>&1) || true
          echo "$output"
          grep -q "REQUIRE_LOGIN is set but OAUTH_SERVER_URL is empty" <<< "$output" \
            || { echo "::error::le conteneur n'a pas refusé de démarrer sans configuration OAuth"; exit 1; }
      - name: ffmpeg présent dans l'image
        run: docker run --rm --entrypoint ffmpeg yt-dl:ci -version

  audit:
    name: Vulnérabilités des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.5"
          enable-cache: false
      - run: uv export --frozen --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
      - run: uvx pip-audit==2.10.1 --strict -r "$RUNNER_TEMP/requirements.txt"

  workflows:
    name: Audit des workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.10.5"
          enable-cache: false
      - run: uvx --from actionlint-py==1.7.12.25 actionlint
      - run: uvx zizmor==1.30.1 --offline .github/workflows
